name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:fast
      - run: npm run lint
      - run: npm run audit:env

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://127.0.0.1:5432/ci
          DIRECT_URL: postgresql://127.0.0.1:5432/ci
          REDIS_URL: redis://127.0.0.1:6379
          NEXTAUTH_SECRET: ci-only-nextauth-secret-at-least-32-characters
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
          PASSWORD_RESET_TOKEN_SECRET: ci-only-reset-secret-at-least-32-characters
          CRON_SECRET: ci-only-cron-secret-at-least-32-characters
          INTERNAL_CRON_SECRET: ci-only-internal-secret-at-least-32-characters
          WS_AUTH_SECRET: ci-only-websocket-secret-at-least-32-characters
          REPLY_API_SECRET: ci-only-reply-secret-at-least-32-characters
          PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret-at-least-32-characters
          META_BROWSER_PURCHASE_TOKEN_SECRET: ci-only-browser-secret-at-least-32-characters

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: minsah-beauty:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=https://example.invalid
            NEXT_PUBLIC_SITE_URL=https://example.invalid
            NEXT_PUBLIC_API_URL=https://example.invalid/api
            NEXT_PUBLIC_REALTIME_WS_URL=wss://example.invalid/ws
            NEXT_PUBLIC_MINIO_PUBLIC_URL=https://media.example.invalid
